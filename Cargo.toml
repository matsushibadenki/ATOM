[workspace]
resolver = "2"
members = [
  "crates/atom-core", "crates/atom-cli", "crates/atom-control", "crates/atom-mcp", "apps/desktop",
  "vendor/threex/crates/core", "vendor/threex/crates/renderer",
  "vendor/unge/crates/unge-core", "vendor/unge/crates/unge-executor",
]
default-members = ["crates/atom-core", "crates/atom-cli", "crates/atom-control", "crates/atom-mcp"]

[workspace.dependencies]
wgpu = "=27.0.1"
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = "thin"
codegen-units = 1
