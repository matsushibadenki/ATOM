<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATOM</title><link rel="stylesheet" href="style.css"></head>
<body>
  <header id="toolbarView" class="view">
    <strong>ATOM<span class="version"> / 3D</span></strong>
    <form id="renameForm"><input id="name" maxlength="80" autocomplete="off" required data-label="project"><button id="rename" type="submit" data-icon="check" data-label="rename"></button></form>
    <div class="meta"><span id="dirty"></span><span id="revision"></span></div>
    <span id="dockPreview" role="status"></span>
    <div class="toolbar"><output id="gpu"></output><button id="undo" data-icon="undo" data-label="undo"></button><button id="redo" data-icon="redo" data-label="redo"></button><button id="resetLayout" data-icon="layout" data-label="reset_layout"></button><button id="reload" data-icon="reload" data-label="reload"></button><button id="save" data-icon="save" data-label="save"></button><select id="locale" aria-label="Language / 言語 / 语言"><option value="ja">日本語</option><option value="en">English</option><option value="zh-CN">简体中文</option></select></div>
  </header>
  <main id="panelView" class="view">
    <div class="panel-title"><div id="tabs" role="tablist"></div><span id="cameraTools"><button id="cameraGrid" data-icon="grid" data-label="show_grid" aria-pressed="true"></button><button id="cameraAxes" data-icon="axes" data-label="show_axes" aria-pressed="true"></button><button id="cameraPan" data-icon="pan" data-label="pan_mode" aria-pressed="false"></button><output id="cameraSelection"></output><button id="cameraFocus" data-icon="focus" data-label="focus_selection"></button><button id="cameraReset" data-icon="reload" data-label="reset_camera"></button><span class="info" tabindex="0" data-label="camera_help">ⓘ</span></span><button id="floatGroup" data-icon="group" data-label="float_group"></button><button id="returnGroup" data-icon="return_group" data-label="return_group" hidden></button><button id="floatPanel" data-icon="float" data-label="float"></button></div>
    <div class="dock-controls"><select id="dockTarget" data-label="target"></select><select id="dockZone" data-label="placement"><option value="center" data-text="center"></option><option value="left" data-text="left"></option><option value="right" data-text="right"></option><option value="top" data-text="top"></option><option value="bottom" data-text="bottom"></option></select><button id="dockApply" data-icon="check" data-label="dock_apply"></button><button id="returnPanel" data-icon="return" data-label="return_panel"></button><span class="info" tabindex="0" data-label="drag">ⓘ</span></div>
    <div id="transformTools" class="transform-tools"><button id="toolCamera" data-icon="select" data-tool="camera" data-label="tool_camera"></button><button id="toolMove" data-icon="move" data-tool="move" data-label="tool_move"></button><button id="toolRotate" data-icon="rotate" data-tool="rotate" data-label="tool_rotate"></button><button id="toolScale" data-icon="scale" data-tool="scale" data-label="tool_scale"></button><select id="transformAxis" data-label="transform_axis"><option value="free" data-text="axis_free"></option><option value="x">X</option><option value="y">Y</option><option value="z">Z</option></select><span class="transform-spacer"></span><button id="viewUndo" data-icon="undo" data-label="undo"></button><button id="viewRedo" data-icon="redo" data-label="redo"></button><span class="info" tabindex="0" data-label="transform_help">ⓘ</span></div>
    <section id="sceneContent" class="panel-content">
      <details class="physics-section" open><summary><span data-text="environment"></span><span class="info" tabindex="0" data-label="gravity_help">ⓘ</span></summary>
        <fieldset id="environmentFields" class="physics-fields" disabled>
          <label class="setting-row"><span data-text="gravity"></span><select id="gravityPreset" data-label="gravity"><option value="earth" data-text="earth"></option><option value="moon" data-text="moon"></option><option value="mars" data-text="mars"></option><option value="zero" data-text="zero"></option><option value="custom" data-text="custom"></option></select></label>
          <div id="gravityVector" class="vector-row"></div>
          <label class="check-row"><input type="checkbox" id="floorEnabled"><span data-text="floor_enabled"></span></label>
        </fieldset>
      </details>
      <details class="physics-section asset-section" open><summary><span>OpenUSD · SimReady</span><span class="info" tabindex="0" data-label="usd_help">ⓘ</span></summary>
        <fieldset id="assetFields" class="physics-fields" disabled>
          <label class="setting-row"><span data-text="asset_source"></span><select id="assetSource" data-label="asset_source"><option value="hugging_face">Hugging Face</option><option value="local" data-text="local_usd"></option></select></label>
          <div id="hubFields" class="physics-fields"><label class="asset-input"><span data-text="hf_repo"></span><input id="assetRepo" value="nvidia/simready-assets" maxlength="200" placeholder="namespace/repository" data-label="hf_repo"></label>
          <div class="asset-search"><input id="assetRevision" value="main" maxlength="80" data-label="asset_revision"><button id="assetCatalog" data-icon="reload" data-label="asset_catalog"></button></div>
          <input id="assetPackage" list="assetPackages" value="box_cardboard_a01" maxlength="1024" data-label="asset_package"><datalist id="assetPackages"></datalist><output id="assetCatalogStatus"></output></div>
          <label id="localFields" class="asset-input" hidden><span data-text="local_usd"></span><input id="assetPath" placeholder="/path/to/asset.usd" maxlength="4096" data-label="local_usd"></label>
          <div class="asset-actions"><button id="importAsset" data-icon="plus" data-label="import_asset"></button><output id="assetStatus"></output></div>
        </fieldset>
        <button id="cancelAssetImport" data-label="cancel_asset" hidden>×</button><div id="assetSelection" hidden><output id="assetInfo"></output><span class="info" tabindex="0" id="assetWarnings">ⓘ</span></div>
      </details>
      <div class="template-row"><select id="robotTemplate" data-label="robot_template"><option value="humanoid" data-text="humanoid"></option><option value="dual_arm" data-text="dual_arm"></option></select><button id="addRobot" data-icon="plus" data-label="add_robot"></button><span class="info" tabindex="0" data-label="robot_help">ⓘ</span></div>
      <div class="action-row"><span id="objectCount"></span><span class="scene-actions"><button id="sceneFocus" data-icon="focus" data-label="focus_selection"></button><button id="add" data-icon="plus" data-label="add"></button></span></div><ul id="objects"></ul><section id="transformInspector"><div class="inspector-head"><span id="inspectorSelection"></span><span class="info" tabindex="0" data-label="numeric_help">ⓘ</span></div><div id="jointSummary" class="position"></div><div id="jointAxes" class="position"></div><fieldset id="transformFields" disabled></fieldset></section>
      <details class="physics-section" open><summary><span data-text="physical_material"></span><span class="info" tabindex="0" data-label="material_help">ⓘ</span></summary>
        <label class="setting-row material-target"><span data-text="material_target"></span><select id="materialTarget" data-label="material_target"><option value="object" data-text="selected_object"></option><option value="floor" data-text="floor"></option></select></label>
        <fieldset id="materialFields" class="physics-fields" disabled>
          <label class="setting-row"><span data-text="physical_material"></span><select id="materialPreset" data-label="physical_material"></select></label>
          <label class="setting-row"><span data-text="density"></span><input id="density" type="number" min="0.001" max="100000" step="any" required data-label="density"></label>
          <div id="frictionVector" class="friction-fields"></div>
          <label class="check-row"><input id="objectFixed" type="checkbox"><span data-text="fixed_body"></span><output id="bodyMass"></output></label>
        </fieldset>
      </details>
    </section>
    <section id="workflowContent" class="panel-content"><div class="simulation-panel"><div class="action-row"><span data-text="physics_preview"></span><span class="info" tabindex="0" data-label="simulation_help">ⓘ</span></div><div class="simulation-controls"><select id="simulationSteps" data-label="duration"><option value="1">0.002 s</option><option value="500" selected>1 s</option><option value="1000">2 s</option></select><button id="simulate" data-icon="play" data-label="run_physics"></button><button id="resetSimulation" data-icon="reload" data-label="reset_physics"></button><output id="simulationStatus"></output></div></div><div class="action-row"><span data-text="tasks"></span><button id="validate" data-icon="play" data-label="validate"></button></div><div class="pipeline"><div><span class="node-icon">01</span><span data-text="tasks"></span></div><span class="connector" aria-hidden="true">↓</span><div><span class="node-icon">02</span><span data-text="validation"></span></div></div><div class="panel-footer"><output id="report" data-text="not_run"></output><span class="info" tabindex="0" data-label="scope">ⓘ</span></div></section>

  </main>
  <div id="statusRow" class="status" role="status" aria-live="polite"><span class="status-dot"></span><output id="status" data-text="connecting"></output></div>
  <div id="splitter" role="separator" tabindex="0" aria-valuemin="10" aria-valuemax="90"></div>
  <script src="app.js"></script>
</body></html>
